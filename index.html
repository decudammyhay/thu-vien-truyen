<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Truyện</title>
    <style>
        body {
            background-color: #F5D0D0; /* Màu nền đỏ nhạt */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .story-card {
            background: #fff;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            padding: 15px;
            transition: transform 0.2s;
        }
        .story-card:hover {
            transform: translateY(-5px);
        }
        .story-image {
            width: 100%;
            height: 350px;
            object-fit: cover;
            border-radius: 10px;
        }
        .story-title {
            font-size: 18px;
            font-weight: bold;
            margin: 15px 0 5px;
            color: #000;
        }
        .story-author {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }
        .read-btn {
            display: inline-block;
            background: #6a35c2; /* Nút bấm màu tím */
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
        }
        .read-btn:hover {
            background: #4e2694;
        }
    </style>
</head>
<body>

    <div class="container" id="story-grid">
        <!-- Dữ liệu sẽ tự động load vào đây -->
    </div>

    <script>
        // Đã trả lại ID có dấu gạch dưới chuẩn xác của bạn!
        const sheetId = '1QJYWVyns_AUyAMUbuLnsUSrN6zNg_AuNVIK4ccy__M'; 
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;

        fetch(url)
            .then(res => res.text())
            .then(text => {
                const json = JSON.parse(text.substr(47).slice(0, -2));
                const rows = json.table.rows;
                const grid = document.getElementById('story-grid');

                rows.forEach((row, index) => {
                    if (index === 0) return; // Bỏ qua dòng tiêu đề

                    // Cơ chế lấy dữ liệu an toàn 
                    const getValue = (colIndex, defaultVal) => {
                        if (row.c && row.c[colIndex] && row.c[colIndex].v != null) {
                            return row.c[colIndex].v;
                        }
                        return defaultVal;
                    };

                    const tenTruyen = getValue(0, ''); // Cột A
                    if (!tenTruyen) return; // Không có tên thì ẩn luôn thẻ đó

                    const tacGia = getValue(1, 'Đang cập nhật'); // Cột B
                    const linkTruyen = getValue(8, '#'); // Cột I (Vị trí số 8)
                    
                    // Lấy ảnh ở cột K (vị trí 10) hoặc J (vị trí 9)
                    let linkAnh = getValue(10, ''); 
                    if (!linkAnh || linkAnh === '#ERROR!') {
                        linkAnh = getValue(9, 'https://via.placeholder.com/250x350?text=Chưa+Có+Ảnh');
                    }

                    const card = `
                        <div class="story-card">
                            <img src="${linkAnh}" alt="${tenTruyen}" class="story-image">
                            <h3 class="story-title">${tenTruyen}</h3>
                            <p class="story-author">${tacGia}</p>
                            <a href="${linkTruyen}" class="read-btn" target="_blank">ĐỌC TRUYỆN ➔</a>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            })
            .catch(error => console.error('Lỗi khi tải dữ liệu:', error));
    </script>
</body>
</html>
