<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Đam Mỹ - Ngôn Tình</title>
    <style>
        :root {
            --primary: #6a35c2;
            --bg-color: #F5D0D0;
            --card-bg: #ffffff;
        }
        body {
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            margin: 0;
            color: #333;
        }
        .navbar {
            background-color: var(--primary);
            padding: 15px;
            text-align: center;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
            font-weight: bold;
            font-size: 16px;
        }
        .main-layout {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            gap: 20px;
            padding: 0 15px;
        }
        .content {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            align-items: start;
        }
        .sidebar {
            flex: 1;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 15px;
            height: fit-content;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .story-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .story-image {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 10px;
        }
        .story-info {
            font-size: 13px;
            text-align: left;
            margin: 10px 0;
            line-height: 1.6;
        }
        .story-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
            text-align: center;
        }
        .btn-read-more {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .widget-title {
            font-size: 16px;
            color: var(--primary);
            border-bottom: 2px dashed var(--primary);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .genre-list {
            list-style: none;
            padding: 0;
        }
        .genre-list li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
            cursor: pointer;
        }
        .counter-img {
            width: 100%;
            margin-top: 10px;
        }
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: red;
        }
        .btn-read-full {
            display: block;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }
        @media (max-width: 768px) {
            .main-layout { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="navbar">
        <a href="#">TRANG CHỦ</a>
        <a href="#">DANH SÁCH TRUYỆN</a>
        <a href="#">TÌNH TRẠNG TRUYỆN</a>
    </div>

    <div class="main-layout">
        <div class="content" id="story-grid">
            <h3 id="loading-text" style="color: #6a35c2; text-align: center; width: 100%;">Đang tải dữ liệu truyện...</h3>
        </div>

        <div class="sidebar">
            <h3 class="widget-title">THỂ LOẠI</h3>
            <ul class="genre-list">
                <li>Đam Mỹ</li>
                <li>Ngôn Tình</li>
                <li>Cổ Đại</li>
                <li>Hiện Đại</li>
                <li>Xuyên Không</li>
            </ul>

            <h3 class="widget-title" style="margin-top: 30px;">LƯỢT TRUY CẬP</h3>
            <a href="https://www.hitwebcounter.com" target="_blank">
                <img src="https://hitwebcounter.com/counter/counter.php?page=16805825&style=0006&nbdigits=5&type=page&initCount=0" title="Counter Widget" Alt="Visit counter For Websites" border="0" class="counter-img"/>
            </a>
        </div>
    </div>

    <div class="modal" id="story-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: #6a35c2;">Tên Truyện</h2>
            <div id="modal-desc" style="line-height: 1.6; margin-top: 15px;">Văn án...</div>
            <a href="#" id="modal-link" class="btn-read-full" target="_blank">ĐỌC TRUYỆN ➔</a>
        </div>
    </div>

    <script>
        // MÌNH ĐÃ ĐIỀN SẴN ID SHEET CỦA BẠN VÀO ĐÂY RỒI NHÉ
        const sheetId = '1QJYWVyns_AUyAMUbuLnsUSrN6zNg_AuNVIK4ccy__M'; 
        
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=0`;
        let storiesData = []; 

        fetch(url)
            .then(res => res.text())
            .then(text => {
                const grid = document.getElementById('story-grid');
                try {
                    const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
                    const json = JSON.parse(jsonString);
                    const rows = json.table.rows;
                    
                    let storiesHTML = '';

                    rows.forEach((row, index) => {
                        if (index === 0) return; 

                        const getValue = (colIndex, defaultVal) => {
                            if (row.c && row.c[colIndex] && row.c[colIndex].v != null) return row.c[colIndex].v;
                            return defaultVal;
                        };

                        const tenTruyen = getValue(0, '');
                        if (!tenTruyen) return;

                        const tacGia = getValue(1, 'Đang cập nhật');
                        const theLoai = getValue(2, 'Đang cập nhật');
                        const cp = getValue(3, 'Đang cập nhật');
                        const chuong = getValue(4, '??');
                        const tinhTrang = getValue(5, 'Đang cập nhật');
                        const team = getValue(6, 'Đang cập nhật');
                        const gioiThieu = getValue(7, 'Chưa có giới thiệu.');
                        const linkTruyen = getValue(8, '#');
                        
                        let linkAnh = getValue(10, ''); 
                        if (!linkAnh || linkAnh === '#ERROR!') linkAnh = getValue(9, 'https://via.placeholder.com/250x350?text=Chưa+Có+Ảnh');

                        storiesData.push({ tenTruyen, gioiThieu, linkTruyen });
                        const arrayIndex = storiesData.length - 1;

                        storiesHTML += `
                            <div class="story-card">
                                <img src="${linkAnh}" alt="${tenTruyen}" class="story-image">
                                <h3 class="story-title">${tenTruyen}</h3>
                                <div class="story-info">
                                    <b>Tác giả:</b> ${tacGia}<br>
                                    <b>Thể loại:</b> ${theLoai}<br>
                                    <b>CP:</b> ${cp}<br>
                                    <b>Số chương:</b> ${chuong}<br>
                                    <b>Tình trạng:</b> ${tinhTrang}<br>
                                    <b>Team:</b> ${team}
                                </div>
                                <button class="btn-read-more" onclick="openModal(${arrayIndex})">ĐỌC TIẾP ➔</button>
                            </div>
                        `;
                    });

                    grid.innerHTML = storiesHTML;

                } catch (error) {
                    console.error("Lỗi:", error);
                    grid.innerHTML = `<p style="color: red; padding: 20px;"><b>LỖI HIỂN THỊ DỮ LIỆU:</b> ID đúng nhưng không thể đọc Sheet. Bạn hãy vào Google Sheet > Tệp > Chia sẻ > Công bố lên web lại một lần nữa nhé.</p>`;
                }
            })
            .catch(error => {
                document.getElementById('story-grid').innerHTML = `<p style="color: red; padding: 20px;"><b>LỖI MẠNG:</b> Không thể kết nối với Google Sheet.</p>`;
            });

        function openModal(index) {
            const data = storiesData[index];
            document.getElementById('modal-title').innerText = data.tenTruyen;
            document.getElementById('modal-desc').innerHTML = data.gioiThieu.replace(/\n/g, '<br>');
            document.getElementById('modal-link').href = data.linkTruyen;
            document.getElementById('story-modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('story-modal').style.display = 'none';
        }
    </script>
</body>
</html>
