<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư Viện Đam Mỹ</title>
    <!-- Thêm font chữ thư pháp / nghệ thuật từ Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #a10000; 
            --bg-color: #F5D0D0; 
            --card-bg: #ffffff;
            --text-color: #333333;
            --sidebar-bg: #ffffff;
            --border-color: #eee;
            --modal-bg: #ffffff;
        }

        /* --- CHẾ ĐỘ TỐI (DARK MODE) --- */
        [data-theme="dark"] {
            --primary: #ff6b6b;
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --sidebar-bg: #2d2d2d;
            --border-color: #444444;
            --modal-bg: #2d2d2d;
        }

        body {
            background-color: var(--bg-color);
            font-family: Arial, sans-serif;
            margin: 0;
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        /* --- TIÊU ĐỀ THƯ PHÁP PHÍA TRÊN --- */
        .site-header {
            text-align: center;
            padding: 35px 10px 25px 10px; /* Đã nới rộng khoảng cách trên dưới */
            background-color: var(--bg-color);
            transition: background-color 0.3s;
        }
        .site-title {
            font-family: 'Great Vibes', cursive, serif;
            font-size: 58px;
            line-height: 1.2;
            color: var(--primary);
            margin: 0;
            padding-bottom: 10px; /* Tránh đuôi chữ bị lẹm */
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
            font-weight: bold;
        }

        /* --- MENU --- */
        .navbar {
            background-color: var(--primary);
            padding: 10px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: nowrap;
            transition: background-color 0.3s;
        }
        .navbar a.nav-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
            font-size: 15px;
            padding: 8px 10px;
            border-radius: 5px;
            transition: background-color 0.3s;
            white-space: nowrap;
        }
        .navbar a.nav-link:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        /* --- NÚT SÁNG/TỐI --- */
        .theme-toggle-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: background-color 0.3s;
            white-space: nowrap;
        }
        .theme-toggle-btn:hover {
            background-color: rgba(255, 255, 255, 0.4);
        }

        /* --- DROPDOWN --- */
        .dropdown {
            position: relative;
            display: inline-flex;
            align-items: center;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            background-color: var(--card-bg);
            min-width: 200px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1000;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px;
            overflow: hidden;
            padding-top: 5px;
            margin-top: 5px;
            transition: background-color 0.3s;
        }
        .dropdown-content.show {
            display: block;
        }
        .dropdown-content a {
            color: var(--text-color);
            padding: 10px 15px;
            text-decoration: none;
            display: block;
            text-align: left;
            font-weight: normal;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .dropdown-content a:hover {
            background-color: var(--bg-color);
            color: var(--primary);
            font-weight: bold;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        .dropdown:hover a.nav-link {
            background-color: rgba(255, 255, 255, 0.2);
        }

        /* --- BỐ CỤC CHÍNH --- */
        .main-layout {
            display: flex;
            max-width: 1200px;
            margin: 20px auto;
            gap: 20px;
            padding: 0 15px;
            flex: 1; /* Đẩy footer xuống dưới cùng */
        }
        .content {
            flex: 3;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            align-items: start;
        }
        .sidebar {
            flex: 1;
            background: var(--sidebar-bg);
            padding: 20px;
            border-radius: 15px;
            height: fit-content;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        
        /* --- CARD TRUYỆN --- */
        .story-card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: background-color 0.3s;
        }
        .story-image {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            border-radius: 10px;
        }
        .story-info {
            font-size: 13px;
            text-align: left;
            margin: 10px 0;
            line-height: 1.6;
            color: var(--text-color);
        }
        .story-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--primary);
            margin: 10px 0;
            text-align: center;
        }
        .btn-read-more {
            background-color: #000;
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        .btn-read-more:hover {
            background-color: var(--primary);
        }

        /* --- SIDEBAR WIDGETS --- */
        .widget-title {
            font-size: 16px;
            color: var(--primary);
            border-bottom: 2px dashed var(--primary);
            padding-bottom: 5px;
            margin-bottom: 15px;
        }
        .genre-list {
            list-style: none;
            padding: 0;
        }
        .genre-list li {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .genre-list a {
            color: var(--text-color);
            text-decoration: none;
            display: block;
            cursor: pointer;
        }
        .genre-list a:hover {
            color: var(--primary);
            font-weight: bold;
        }

        /* --- MODAL POPUP --- */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 999;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: var(--modal-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
            transition: background-color 0.3s, color 0.3s;
        }
        .close-btn {
            position: absolute;
            top: 15px; right: 20px;
            font-size: 24px;
            cursor: pointer;
            color: red;
        }
        .btn-read-full {
            display: block;
            text-align: center;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
        }

        /* --- FOOTER CHÂN WEB --- */
        .site-footer {
            text-align: center;
            padding: 25px 15px;
            background-color: var(--card-bg);
            color: var(--text-color);
            border-top: 2px dashed var(--primary);
            margin-top: 40px;
            font-size: 15px;
            line-height: 1.6;
            font-style: italic;
            transition: background-color 0.3s, color 0.3s;
        }
        .site-footer span.heart {
            color: var(--primary);
            font-style: normal;
        }

        /* --- TỐI ƯU GIAO DIỆN ĐIỆN THOẠI --- */
        @media (max-width: 768px) {
            .site-title { font-size: 42px; }
            .site-header { padding: 25px 10px 15px 10px; }
            .main-layout { flex-direction: column; }
            .navbar {
                gap: 5px;
                padding: 8px 5px;
            }
            .navbar a.nav-link, .theme-toggle-btn {
                font-size: 11px;
                padding: 5px 6px;
            }
            .site-footer {
                font-size: 13px;
                padding: 20px 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Tiêu đề thư viện dạng chữ nghệ thuật phía trên menu -->
    <div class="site-header">
        <h1 class="site-title">Thư Viện Đam Mỹ</h1>
    </div>

    <div class="navbar">
        <a href="#" class="nav-link" onclick="filterAll(event)">TRANG CHỦ</a>
        
        <!-- Menu Tình Trạng Dropdown -->
        <div class="dropdown">
            <a href="#" class="nav-link" onclick="toggleDropdown(event, 'dynamic-status-list')">TÌNH TRẠNG ▾</a>
            <div class="dropdown-content" id="dynamic-status-list">
                <a href="#">Đang tải...</a>
            </div>
        </div>

        <!-- Menu Team Dropdown -->
        <div class="dropdown">
            <a href="#" class="nav-link" onclick="toggleDropdown(event, 'dynamic-team-list')">TEAM ▾</a>
            <div class="dropdown-content" id="dynamic-team-list">
                <a href="#">Đang tải...</a>
            </div>
        </div>

        <!-- Nút chuyển đổi Sáng/Tối -->
        <button class="theme-toggle-btn" id="theme-btn" onclick="toggleTheme()">🌙 Tối</button>
    </div>

    <div class="main-layout">
        <div class="content" id="story-grid">
            <h3 id="loading-text" style="color: var(--primary); text-align: center; width: 100%;">Đang tải dữ liệu truyện...</h3>
        </div>

        <div class="sidebar">
            <h3 class="widget-title">THỂ LOẠI</h3>
            <ul class="genre-list" id="dynamic-genre-list">
                <li>Đang tải...</li>
            </ul>
        </div>
    </div>

    <!-- Chân web giới thiệu -->
    <div class="site-footer">
        Góc nhỏ tổng hợp truyện chữ Đam Mỹ của những thước phim AI mãn nhãn.<br>
        Chúc mọi người có những phút giây thư giãn thật tuyệt vời! <span class="heart">❤</span>
    </div>

    <div class="modal" id="story-modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: var(--primary);">Tên Truyện</h2>
            <div id="modal-desc" style="line-height: 1.6; margin-top: 15px;">Văn án...</div>
            <a href="#" id="modal-link" class="btn-read-full" target="_blank">ĐỌC TRUYỆN ➔</a>
        </div>
    </div>

    <script>
        function toggleDropdown(event, id) {
            event.preventDefault();
            event.stopPropagation();
            const dropdowns = document.querySelectorAll('.dropdown-content');
            dropdowns.forEach(d => {
                if (d.id !== id) d.classList.remove('show');
            });
            document.getElementById(id).classList.toggle('show');
        }

        window.onclick = function() {
            document.querySelectorAll('.dropdown-content').forEach(d => {
                d.classList.remove('show');
            });
        }

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.getElementById('theme-btn').innerText = '☀️ Sáng';
        }

        function toggleTheme() {
            const theme = document.documentElement.getAttribute('data-theme');
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                localStorage.setItem('theme', 'light');
                document.getElementById('theme-btn').innerText = '🌙 Tối';
            } else {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('theme-btn').innerText = '☀️ Sáng';
            }
        }

        const sheetId = '1QJYWYyns-AUyAMUbuLnsUSrN6zNg-AuNVlK4ccy-__M'; 
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json&gid=0`;
        let storiesData = []; 
        let allGenres = new Set();
        let allStatuses = new Set(); 
        let allTeams = new Set();

        function fixDriveLink(url) {
            if (!url) return '';
            let match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
            if (match && match[1]) {
                return `https://lh3.googleusercontent.com/d/${match[1]}=s800`;
            }
            return url;
        }

        fetch(url)
            .then(res => res.text())
            .then(text => {
                const grid = document.getElementById('story-grid');
                try {
                    const match = text.match(/google\.visualization\.Query\.setResponse\((.*)\);/);
                    if (!match) throw new Error("Sai ID");
                    
                    const json = JSON.parse(match[1]);
                    const rows = json.table.rows;
                    
                    let storiesHTML = '';

                    rows.forEach((row) => {
                        const getValue = (colIndex, defaultVal) => {
                            if (row.c && row.c[colIndex] && row.c[colIndex].v != null) return row.c[colIndex].v;
                            return defaultVal;
                        };

                        const tenTruyen = getValue(0, '');
                        if (!tenTruyen || tenTruyen.toString().toLowerCase().includes('tên truyện')) return;

                        const tacGia = getValue(1, 'Đang cập nhật');
                        const theLoai = getValue(2, 'Đang cập nhật');
                        
                        if (theLoai !== 'Đang cập nhật') {
                            theLoai.split(',').forEach(g => {
                                let cleanGenre = g.trim();
                                if (cleanGenre) allGenres.add(cleanGenre);
                            });
                        }

                        const cp = getValue(3, 'Đang cập nhật');
                        const chuong = getValue(4, '??');
                        const tinhTrang = getValue(5, 'Đang cập nhật');
                        
                        if (tinhTrang !== 'Đang cập nhật' && tinhTrang.trim() !== '') {
                            allStatuses.add(tinhTrang.trim());
                        }

                        const team = getValue(6, 'Đang cập nhật');
                        if (team !== 'Đang cập nhật' && team.trim() !== '') {
                            allTeams.add(team.trim());
                        }

                        const gioiThieu = getValue(7, 'Chưa có giới thiệu.');
                        const linkTruyen = getValue(8, '#');
                        
                        let rawLinkAnh = getValue(9, ''); 
                        let linkAnh = fixDriveLink(rawLinkAnh);
                        
                        if (!linkAnh) {
                            linkAnh = 'https://via.placeholder.com/250x350?text=Chưa+Có+Ảnh';
                        }

                        storiesData.push({ tenTruyen, gioiThieu, linkTruyen });
                        const arrayIndex = storiesData.length - 1;

                        storiesHTML += `
                            <div class="story-card" data-genre="${theLoai}" data-status="${tinhTrang}" data-team="${team}">
                                <img src="${linkAnh}" alt="${tenTruyen}" class="story-image">
                                <h3 class="story-title">${tenTruyen}</h3>
                                <div class="story-info">
                                    <b>Tác giả:</b> ${tacGia}<br>
                                    <b>Thể loại:</b> ${theLoai}<br>
                                    <b>CP:</b> ${cp}<br>
                                    <b>Số chương:</b> ${chuong}<br>
                                    <b>Tình trạng:</b> ${tinhTrang}<br>
                                    <b>Team:</b> ${team}
                                </div>
                                <button class="btn-read-more" onclick="openModal(${arrayIndex})">ĐỌC TIẾP ➔</button>
                            </div>
                        `;
                    });

                    grid.innerHTML = storiesHTML;

                    const genreListUl = document.getElementById('dynamic-genre-list');
                    let genresHTML = `<li><a href="#" onclick="filterAll(event)">📚 Tất cả truyện</a></li>`;
                    
                    Array.from(allGenres)
                        .sort((a, b) => a.localeCompare(b, 'vi'))
                        .forEach(g => {
                            genresHTML += `<li><a href="#" onclick="filterGenre('${g}', event)">${g}</a></li>`;
                        });
                    genreListUl.innerHTML = genresHTML;

                    const statusDropdown = document.getElementById('dynamic-status-list');
                    let statusHTML = '';
                    
                    Array.from(allStatuses)
                        .sort((a, b) => a.localeCompare(b, 'vi'))
                        .forEach(s => {
                            statusHTML += `<a href="#" onclick="filterStatus('${s}', event)">${s}</a>`;
                        });
                    statusDropdown.innerHTML = statusHTML;

                    const teamDropdown = document.getElementById('dynamic-team-list');
                    let teamHTML = '';
                    
                    Array.from(allTeams)
                        .sort((a, b) => a.localeCompare(b, 'vi'))
                        .forEach(t => {
                            teamHTML += `<a href="#" onclick="filterTeam('${t}', event)">${t}</a>`;
                        });
                    teamDropdown.innerHTML = teamHTML;

                } catch (error) {
                    grid.innerHTML = `<p style="color: red; padding: 20px;"><b>LỖI DỮ LIỆU:</b> Kiểm tra lại ID Google Sheet của bạn.</p>`;
                }
            })
            .catch(error => {
                document.getElementById('story-grid').innerHTML = `<p style="color: red; padding: 20px;"><b>LỖI MẠNG:</b> Không kết nối được Google Sheet.</p>`;
            });

        function filterAll(event) {
            event.preventDefault();
            const cards = document.querySelectorAll('.story-card');
            cards.forEach(card => card.style.display = 'block');
        }

        function filterGenre(selectedGenre, event) {
            event.preventDefault();
            const cards = document.querySelectorAll('.story-card');
            cards.forEach(card => {
                const genresOfCard = card.getAttribute('data-genre');
                if (genresOfCard.includes(selectedGenre)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterStatus(selectedStatus, event) {
            event.preventDefault();
            const cards = document.querySelectorAll('.story-card');
            cards.forEach(card => {
                const statusOfCard = card.getAttribute('data-status');
                if (statusOfCard.includes(selectedStatus)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function filterTeam(selectedTeam, event) {
            event.preventDefault();
            const cards = document.querySelectorAll('.story-card');
            cards.forEach(card => {
                const teamOfCard = card.getAttribute('data-team');
                if (teamOfCard.includes(selectedTeam)) {
                    card.style.display = 'block';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function openModal(index) {
            const data = storiesData[index];
            document.getElementById('modal-title').innerText = data.tenTruyen;
            document.getElementById('modal-desc').innerHTML = data.gioiThieu.replace(/\n/g, '<br>');
            document.getElementById('modal-link').href = data.linkTruyen;
            document.getElementById('story-modal').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('story-modal').style.display = 'none';
        }
    </script>
</body>
</html>
